name: Linter
on:
  push:
    branches:
      - main
  pull_request: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Generate go code
        run: go generate ./...
      - name: Lint Go code
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true
          version: v2.13.2
      - name: Check for Typos
        uses: crate-ci/typos@v1.50.1
        with:
          config: .typos.toml
